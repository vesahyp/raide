name: Deploy to GitHub Pages

# Publish a new build whenever the default branch changes (e.g. a merged PR),
# and on demand via the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed to deploy to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The pixel: a repository variable, so a fork's build has none and
      # beacons nowhere. See index.html.
      - run: npm run build
        env:
          VITE_PIXEL_URL: ${{ vars.VITE_PIXEL_URL }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
