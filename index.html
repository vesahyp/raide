<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale and user-scalable stop the browser's pinch-zoom from
         fighting the thumb; viewport-fit=cover claims the notch, and the CSS
         keeps the HUD inside the safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2a1e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Raide</title>
    <meta name="description" content="Rautatiepeli puhelimeen: vedä rata, osta juna, kuljeta tukit sahalle ja laudat kaupunkiin. Suomi 1862." />
    <!-- Analytics: the clavesa tracker (vendored from clavesa-dev/web-tracker)
         beacons to a 1x1 GIF on our CloudFront; its access logs are the
         datastore. See TRACKING.md. The pixel URL is VITE_PIXEL_URL at build
         time: a GitHub repository variable for the Pages deploy, .env.local
         (make env) here. A clone or fork without it sends nothing. Off on
         localhost and for ?bot=1 script runs. -->
    <script>
      window.TRACKER_CONFIG = {
        endpoint: "%VITE_PIXEL_URL%",
        spa: true,
        enabled: /^https:/.test("%VITE_PIXEL_URL%") && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]bot=1/.test(location.search)
      };
    </script>
    <script defer src="/tracker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
